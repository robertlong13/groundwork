name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5

      - run: dotnet restore

      - run: dotnet build --no-restore

      - run: dotnet test --no-build

      - run: dotnet tool restore

      - run: dotnet csharpier check .
